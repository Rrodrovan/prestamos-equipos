spring.application.name=prestamos-equipos

# Carga las variables desde el archivo .env (si existe) en la raíz del proyecto backend.
# El .env NO se sube a GitHub (está en .gitignore). Use .env.example como plantilla.
spring.config.import=optional:file:.env[.properties]

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tecnouam_prestamos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT (el secreto NUNCA va escrito aquí) ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- CORS (origen del frontend React / Vite) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
