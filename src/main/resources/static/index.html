<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TecnoUAM · Préstamo de equipos</title>

  <!-- React + Axios + Babel por CDN: no requiere Node ni Vite. Lo sirve Spring Boot desde /static -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

  <style>
    :root { font-family: system-ui, Arial, sans-serif; color: #1f2328; background: #f6f7f9; }
    body { margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.6rem; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .card.wide { max-width: none; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
    input { padding: 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 1rem; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #1a5fb4; color: #fff; cursor: pointer; font-size: .95rem; margin-left: 8px; }
    button:disabled { opacity: .6; cursor: default; }
    button.secondary { background: #666; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .toolbar h2 { margin: 0; }
    .user { font-size: .85rem; color: #555; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e5e5; }
    th { background: #f3f4f6; }
    .badge { padding: 2px 10px; border-radius: 12px; font-size: .8rem; font-weight: 600; }
    .badge.disponible { background: #d9f2e1; color: #15602b; }
    .badge.prestado { background: #fde2d3; color: #9c3d0c; }
    .info { color: #555; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Cliente Axios: misma URL del servidor (sin CORS) y JWT en cada petición
    const api = axios.create({ baseURL: '' });
    api.interceptors.request.use((config) => {
      const token = localStorage.getItem('token');
      if (token) config.headers.Authorization = 'Bearer ' + token;
      return config;
    });

    /* ---------- Login: obtiene el JWT real desde la API ---------- */
    function Login({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const { data } = await api.post('/api/auth/login', { username, password });
          localStorage.setItem('token', data.token);
          localStorage.setItem('usuario', data.username + ' (' + data.rol + ')');
          onLogin();
        } catch (err) {
          setError(err.response && err.response.status === 401
            ? 'Usuario o contraseña incorrectos'
            : 'No se pudo conectar con el servidor');
        } finally {
          setLoading(false);
        }
      };

      return (
        <form className="card" onSubmit={handleSubmit}>
          <h2>Iniciar sesión</h2>
          <label>Usuario
            <input value={username} onChange={(e) => setUsername(e.target.value)} required />
          </label>
          <label>Contraseña
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
          </label>
          {error && <p className="error">{error}</p>}
          <button type="submit" disabled={loading}>{loading ? 'Ingresando…' : 'Ingresar'}</button>
        </form>
      );
    }

    /* ---------- Tabla de equipos: GET protegido con token ---------- */
    function EquiposTable({ onLogout }) {
      const [equipos, setEquipos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      const cargar = async () => {
        setLoading(true);
        setError('');
        try {
          const { data } = await api.get('/api/equipos');
          setEquipos(data);
        } catch (err) {
          if (err.response && err.response.status === 401) { onLogout(); return; } // token vencido o inválido
          setError('Error al cargar los equipos. Verifique que la API esté activa.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { cargar(); }, []);

      return (
        <div className="card wide">
          <div className="toolbar">
            <h2>Equipos tecnológicos</h2>
            <div>
              <span className="user">{localStorage.getItem('usuario')}</span>
              <button onClick={cargar}>Recargar</button>
              <button className="secondary" onClick={onLogout}>Salir</button>
            </div>
          </div>

          {loading && <p className="info">Cargando equipos…</p>}
          {!loading && error && <p className="error">{error}</p>}
          {!loading && !error && equipos.length === 0 && <p className="info">No hay equipos registrados.</p>}

          {!loading && !error && equipos.length > 0 && (
            <table>
              <thead>
                <tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Estado</th></tr>
              </thead>
              <tbody>
                {equipos.map((eq) => (
                  <tr key={eq.id}>
                    <td>{eq.codigoPatrimonial}</td>
                    <td>{eq.nombre}</td>
                    <td>{eq.tipo}</td>
                    <td><span className={'badge ' + eq.estado.toLowerCase()}>{eq.estado}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      );
    }

    function App() {
      const [autenticado, setAutenticado] = useState(!!localStorage.getItem('token'));

      const logout = () => {
        localStorage.removeItem('token');
        localStorage.removeItem('usuario');
        setAutenticado(false);
      };

      return (
        <main>
          <h1>TecnoUAM · Préstamo de equipos</h1>
          {autenticado ? <EquiposTable onLogout={logout} /> : <Login onLogin={() => setAutenticado(true)} />}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
